<svg width="600" height="460" viewBox="0 0 600 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#4B3FE0"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#EDEBFE"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1c1440" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="40" y="30" width="520" height="400" rx="28" fill="url(#panelGrad)" filter="url(#soft)"/>

  <!-- window dots -->
  <circle cx="76" cy="66" r="6" fill="rgba(255,255,255,0.55)"/>
  <circle cx="96" cy="66" r="6" fill="rgba(255,255,255,0.35)"/>
  <circle cx="116" cy="66" r="6" fill="rgba(255,255,255,0.25)"/>

  <!-- headline block -->
  <rect x="72" y="100" width="220" height="16" rx="8" fill="rgba(255,255,255,0.9)"/>
  <rect x="72" y="126" width="150" height="12" rx="6" fill="rgba(255,255,255,0.5)"/>

  <!-- bar chart -->
  <g>
    <rect x="72" y="330" width="36" height="60" rx="8" fill="url(#barGrad)"/>
    <rect x="120" y="300" width="36" height="90" rx="8" fill="url(#barGrad)" opacity="0.9"/>
    <rect x="168" y="260" width="36" height="130" rx="8" fill="url(#barGrad)" opacity="0.85"/>
    <rect x="216" y="220" width="36" height="170" rx="8" fill="#ffffff"/>
  </g>

  <!-- trend line over bars -->
  <path d="M80 320 C 130 300, 170 250, 234 210" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="234" cy="210" r="7" fill="#ffffff"/>

  <!-- floating stat chip -->
  <g filter="url(#soft)">
    <rect x="330" y="150" width="180" height="92" rx="16" fill="#ffffff"/>
    <text x="352" y="188" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#26A65B">+125%</text>
    <text x="352" y="210" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#5B5F73">Traffic Growth</text>
  </g>

  <!-- store / cart icon chip -->
  <g filter="url(#soft)">
    <rect x="330" y="260" width="180" height="92" rx="16" fill="#ffffff"/>
    <circle cx="362" cy="306" r="20" fill="#EEEBFE"/>
    <path d="M352 300 h20 l-4 16 h-12 z" fill="#6C5CE7"/>
    <circle cx="358" cy="320" r="2.5" fill="#6C5CE7"/>
    <circle cx="368" cy="320" r="2.5" fill="#6C5CE7"/>
    <text x="392" y="302" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#161A2E">Online Store</text>
    <text x="392" y="320" font-family="Arial, sans-serif" font-size="11" font-weight="500" fill="#5B5F73">Live &amp; Growing</text>
  </g>
</svg>
